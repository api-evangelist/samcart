description: >-
  FinOps view of SamCart spend. SamCart is billed as a fixed monthly (or
  discounted annual) SaaS subscription to a plan tier - Core, Pro, or Enterprise
  - rather than as a usage-metered API. The Public API does not carry its own
  per-call fee; it is a feature of a paid SamCart account. From a cost-management
  standpoint the recurring plan fee is the dominant, predictable line item;
  payment-processing fees on transactions flow through the connected payment
  processor (for example Stripe or PayPal) rather than through SamCart's own
  invoice on current plans.
notes: >-
  Plan prices are grounded in SamCart's published pricing but should be verified
  at https://www.samcart.com/pricing. API access is provisioned by SamCart
  Support and may require a higher tier; treat that as a plan-selection decision,
  not a separate metered cost.
