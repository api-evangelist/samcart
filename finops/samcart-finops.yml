meters:
- name: plan_subscription
  description: Recurring monthly or annual fee for the selected SamCart plan tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: transactions
  description: Orders and charges processed through SamCart checkout; drive processor fees, not SamCart usage fees on current plans.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - product
principles:
- name: Visibility
  description: Track the recurring plan fee and monitor order/charge volume via the API to understand the commerce activity behind the flat subscription.
- name: Allocation
  description: Map the SamCart subscription to the product line or brand it supports; attribute processor fees per product using order and charge data.
- name: Optimization
  description: Right-size the plan tier to the features actually used, and prefer annual billing (~25% discount) for stable, long-running stores.
- name: Accountability
  description: Assign an owner for the SamCart subscription and review plan tier against feature and API needs periodically.
