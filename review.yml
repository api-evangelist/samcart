aid: samcart
name: SamCart
review:
  question: Does SamCart expose a documented public WebSocket API?
  answer: false
  date: '2026-07-05'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. SamCart's own public API surface (the
    SamCart Public API v1 at https://api.samcart.com/v1) is request/response
    REST over HTTPS - there is no server-push transport (WebSocket or SSE) on
    SamCart's own API to model. SamCart does offer event notifications, but they
    are delivered as outbound HTTP webhooks ("Notify URL") that POST to a
    consumer-provided endpoint, not as a WebSocket stream. Those webhooks could
    be modeled as an AsyncAPI (webhook binding) in the future, but there is no
    ws:// or wss:// endpoint on SamCart's API.
findings:
  summary: |
    SamCart does not publish a documented public WebSocket API. SamCart is a
    checkout / e-commerce platform for selling digital products, courses, and
    subscriptions. Its public developer surface is the SamCart Public API (v1),
    a REST API at base URL https://api.samcart.com/v1, authenticated with an API
    key passed in the sc-api header. The API is pure request/response REST over
    HTTPS covering orders, products, customers, subscriptions, charges, and
    refunds. Realtime/event delivery is handled by outbound HTTP webhooks (the
    "Notify URL"), which are server-to-endpoint HTTP POSTs, not a bidirectional
    or server-push WebSocket. No ws:// or wss:// endpoint is documented anywhere
    in SamCart's public documentation as of the review date.
  accessModel: |
    Access is not fully self-serve. API keys are generated by the SamCart
    Support team on request (contact support@samcart.com), and access has
    historically been tied to a beta program and higher plan tiers. A paid
    SamCart account (Core, Pro, or Enterprise on current plans; the legacy Scale
    tier historically included API access) is required. The API itself carries
    no separate per-call fee.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.samcart.com/v1
      documented: true
      note: SamCart Public API v1. Request/response REST authenticated with the sc-api API key header.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Notify URL / webhooks POST order, subscription, charge, refund, product, and customer events to a consumer endpoint. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in SamCart's public API docs or knowledge base as of the review date.
  endpointsConfirmedRest:
    - GET    https://api.samcart.com/v1/orders
    - GET    https://api.samcart.com/v1/orders/{order_id}
    - GET    https://api.samcart.com/v1/products
    - GET    https://api.samcart.com/v1/customers
    - GET    https://api.samcart.com/v1/customers/{customer_id}
    - GET    https://api.samcart.com/v1/subscriptions
    - GET    https://api.samcart.com/v1/charges
    - GET    https://api.samcart.com/v1/refunds
    - GET    https://api.samcart.com/v1/refunds/{refund_id}
  endpointsModeled:
    - PATCH  https://api.samcart.com/v1/orders/{order_id}   (update order / upsell custom fields - action confirmed, exact path modeled)
    - GET    https://api.samcart.com/v1/products/{product_id}
    - GET    https://api.samcart.com/v1/subscriptions/{subscription_id}
    - POST   https://api.samcart.com/v1/subscriptions/{subscription_id}/cancel   (cancel confirmed, exact path modeled)
    - POST   https://api.samcart.com/v1/subscriptions/{subscription_id}/schedule-cancellation   (scheduled cancel confirmed, exact path modeled)
    - GET    https://api.samcart.com/v1/charges/{charge_id}
    - POST   https://api.samcart.com/v1/charges/{charge_id}/refund   (full refund of a charge confirmed, exact path modeled)
sources:
  - url: https://developer.samcart.com/
    type: Documentation
    note: Official SamCart Public API docs (OpenAPI-based). SPA renders client-side; content confirmed via knowledge base and integration guides.
  - url: https://help.samcart.com/support/solutions/articles/60000805533-samcart-api
    type: APIReference
    note: Knowledge base article. Confirms sc-api header auth, support-provisioned keys, and orders/customers/products/subscriptions/charges/upsells resources.
  - url: https://www.samcart.com/blog/announcing-samcarts-new-api
    type: Blog
    note: SamCart announcement of the v1 API (OpenAPI-documented; orders, products, customers, charges, subscriptions).
  - url: https://rollout.com/integration-guides/sam-cart/api-essentials
    type: IntegrationGuide
    note: Third-party guide confirming resources and base URL https://api.samcart.com/v1.
  - url: https://help.samcart.com/support/solutions/articles/60000506436-using-webhooks-on-samcart
    type: Documentation
    note: Notify URL / webhooks - outbound HTTP event delivery, not WebSocket.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on SamCart's own API, and the public
    API is request/response REST. Event delivery is via outbound HTTP webhooks
    (Notify URL) rather than a server-push WebSocket, so no AsyncAPI document was
    created. The apis.yml catalogs the REST APIs (Orders, Products, Customers,
    Subscriptions, Charges and Refunds).
