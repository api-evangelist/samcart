aid: samcart
url: https://raw.githubusercontent.com/api-evangelist/samcart/refs/heads/main/apis.yml
name: SamCart
kind: company
description: SamCart is a checkout and e-commerce platform for selling digital products,
  courses, memberships, and physical goods directly to customers, built around a
  high-converting CheckoutOS checkout, one-click upsells, subscriptions, and a
  courses/members area. The SamCart Public API (v1) is a REST API at
  https://api.samcart.com/v1 that gives programmatic read access to a marketplace's
  orders, products, customers, subscriptions, charges, and refunds, plus write
  actions to cancel or schedule cancellation of subscriptions, refund charges, and
  update order custom fields. Authentication is via an sc-api API key header, and
  API access is provisioned by the SamCart Support team rather than fully self-serve.
